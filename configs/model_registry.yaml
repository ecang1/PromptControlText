# =============================================================================
# Model registry for HuggingFace downloads + vLLM serving.
#
# NOTE: Some of these repo IDs (Gemma "4", Qwen "3.6", Nemotron "3.5"/"3") are
# very recent / cutting-edge releases as of the model's knowledge cutoff.
# Double-check the exact `repo_id` on https://huggingface.co before running
# the download script — HF org/repo naming sometimes differs slightly from
# marketing names (e.g. "Gemma 4 12B" might actually be published as
# `google/gemma-4-12b-it`). Edit the `repo_id` fields below if a 404 occurs.
# =============================================================================

models:
  # Frozen composition_v1 confirmatory generators.
  - slug: llama31_8b_instruct
    repo_id: meta-llama/Llama-3.1-8B-Instruct
    revision: main
    local_dir_name: meta-llama--Llama-3.1-8B-Instruct
    allow_patterns: null
    gated: true
    tensor_parallel_size: 1
    gpus: 1

  - slug: llama33_70b_instruct
    repo_id: meta-llama/Llama-3.3-70B-Instruct
    revision: main
    local_dir_name: meta-llama--Llama-3.3-70B-Instruct
    allow_patterns: null
    gated: true
    tensor_parallel_size: 4
    gpus: 4

  - slug: qwen2_7b_instruct
    repo_id: Qwen/Qwen2-7B-Instruct
    revision: main
    local_dir_name: Qwen--Qwen2-7B-Instruct
    allow_patterns: null
    gated: false
    tensor_parallel_size: 1
    gpus: 1

  - slug: qwen25_72b_instruct
    repo_id: Qwen/Qwen2.5-72B-Instruct
    revision: main
    local_dir_name: Qwen--Qwen2.5-72B-Instruct
    allow_patterns: null
    gated: false
    tensor_parallel_size: 4
    gpus: 4

  - slug: gemma4_12b
    repo_id: google/gemma-4-12B-it
    revision: main
    local_dir_name: google--gemma-4-12B-it
    allow_patterns: null          # null = download everything (safetensors, tokenizer, config)
    gated: true                   # Gemma models require accepting license on HF + a HF token
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 8192

  - slug: gemma4_31b
    repo_id: google/gemma-4-31B-it
    revision: main
    local_dir_name: google--gemma-4-31B-it
    allow_patterns: null
    gated: true
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 8192

  - slug: qwen3_6_35b_a3b
    repo_id: Qwen/Qwen3.6-35B-A3B-FP8
    revision: main
    local_dir_name: Qwen--Qwen3.6-35B-A3B-FP8
    allow_patterns: null
    gated: false
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 8192
    is_moe: true                  # A3B = ~3B active experts; needs vLLM MoE support
    is_fp8: true                   # pre-quantized FP8 checkpoint; no extra --quantization flag needed for vLLM (auto-detected from config)

  - slug: deepseek_r1_distill_qwen_32b
    repo_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    revision: main
    local_dir_name: deepseek-ai--DeepSeek-R1-Distill-Qwen-32B
    allow_patterns: null
    gated: false
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 8192

  - slug: deepseek_r1_distill_llama_70b
    repo_id: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    revision: main
    local_dir_name: deepseek-ai--DeepSeek-R1-Distill-Llama-70B
    allow_patterns: null
    gated: false
    tensor_parallel_size: 4
    gpus: 4
    max_model_len: 8192

  - slug: nemotron_3_5_lightning_30b_a3b
    repo_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    revision: main
    local_dir_name: nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    allow_patterns: null
    gated: true                   # NVIDIA NGC/HF models are often gated
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 8192
    is_moe: true

  - slug: nemotron_3_nano_4b_gguf
    repo_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-GGUF
    revision: main
    local_dir_name: nvidia--NVIDIA-Nemotron-3-Nano-4B-GGUF
    allow_patterns:
      - "*.gguf"
      - "*.json"
      - "tokenizer*"
    gated: true
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 8192
    is_gguf: true                 # vLLM serves GGUF via --quantization gguf, single file passed as --model
    # NOTE: transformers'/vLLM's GGUF loader does not yet support the
    # "nemotron_h" hybrid Mamba+attention architecture used by this model
    # (raises `ValueError: GGUF model with architecture nemotron_h is not
    # supported yet.`). Use the `nemotron_3_nano_4b` entry below (native
    # safetensors checkpoint) instead until upstream GGUF support lands.

  - slug: nemotron_3_nano_4b
    repo_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    revision: main
    local_dir_name: nvidia--NVIDIA-Nemotron-3-Nano-4B-BF16
    allow_patterns: null
    gated: true
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 8192
    is_gguf: false                # native safetensors checkpoint; bypasses the broken GGUF loader path
